<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Chip Bagger Admin</title>
  <link rel="icon" type="image/svg+xml" href="../images/brand/logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#334788">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#">
        <img class="logo-mark" src="../images/brand/logo.svg" alt="" width="36" height="36">
        <span>Admin</span>
      </a>
      <div id="account" class="account" hidden>
        <span id="account-email" class="muted small"></span>
        <button id="sign-out" class="btn btn-small" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap admin">
    <p id="status" class="status" role="status" hidden></p>

    <section id="view-loading" class="view">
      <p class="muted">Loading…</p>
    </section>

    <section id="view-setup" class="view" hidden>
      <h1>Not available</h1>
    </section>

    <section id="view-signin" class="view" hidden>
      <h1>Sign in</h1>
      <button id="sign-in" class="btn btn-primary btn-big" type="button">Sign in with Google</button>
    </section>

    <section id="view-denied" class="view" hidden>
      <h1>No access</h1>
      <p>This account doesn't have access.</p>
    </section>

    <section id="view-list" class="view" hidden>
      <div class="list-head">
        <h1>Bags</h1>
        <a class="btn btn-primary" href="#new">+ Add bag</a>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search brand, flavor, notes…" aria-label="Search bags">
        <select id="filter" aria-label="Show">
          <option value="active">Active</option>
          <option value="unrated">Needs rating</option>
          <option value="nolocation">Needs location</option>
          <option value="deleted">Deleted</option>
        </select>
      </div>
      <p id="list-count" class="muted small"></p>
      <ul id="bag-list" class="bag-list"></ul>
    </section>

    <section id="view-edit" class="view" hidden>
      <a class="back" href="#">← All bags</a>
      <form id="bag-form" novalidate>
        <h1 id="edit-title">Add bag</h1>
        <p id="deleted-banner" class="deleted-banner" hidden>This bag is deleted and hidden from the site.</p>

        <div class="photo-field">
          <div id="photo-preview" class="photo-preview"></div>
          <label class="btn">
            <span id="photo-label">Take or choose photo</span>
            <input id="photo" type="file" accept="image/*" class="visually-hidden">
          </label>
        </div>

        <label class="field">
          <span>Brand</span>
          <input id="f-brand" required maxlength="100" list="brand-options" autocomplete="off" autocapitalize="words">
        </label>
        <datalist id="brand-options"></datalist>

        <label class="field">
          <span>Flavor</span>
          <input id="f-flavor" maxlength="200" autocomplete="off" autocapitalize="words">
        </label>

        <label class="field">
          <span>Notes</span>
          <textarea id="f-notes" rows="2" maxlength="1000"></textarea>
        </label>

        <label class="field">
          <span>Made in</span>
          <select id="f-made-in"></select>
        </label>

        <div id="new-place" class="new-place" hidden>
          <label class="field">
            <span>City</span>
            <input id="np-city" type="text" maxlength="100" autocomplete="off" placeholder="e.g. Lancaster">
          </label>
          <label class="field">
            <span>State / province</span>
            <input id="np-state" type="text" maxlength="100" autocomplete="off" placeholder="e.g. Pennsylvania">
          </label>
          <label class="field">
            <span>Country</span>
            <input id="np-country" type="text" maxlength="100" autocomplete="off" placeholder="e.g. USA">
          </label>
          <button type="button" id="np-lookup" class="btn">Check location</button>
          <p id="np-result" class="muted" role="status"></p>
          <p class="muted">Coordinates are looked up automatically when you save.</p>
        </div>

        <fieldset class="ratings">
          <legend>Ratings</legend>
          <div class="rating" data-field="collectability">
            <span class="rating-label">Collectability</span>
            <input type="range" min="1" max="10" step="1" value="5" aria-label="Collectability">
            <output>–</output>
            <button type="button" class="link rating-clear">Clear</button>
          </div>
          <div class="rating" data-field="curb_appeal">
            <span class="rating-label">Curb appeal</span>
            <input type="range" min="1" max="10" step="1" value="5" aria-label="Curb appeal">
            <output>–</output>
            <button type="button" class="link rating-clear">Clear</button>
          </div>
        </fieldset>

        <div class="form-actions">
          <button id="save" class="btn btn-primary" type="submit">Save</button>
          <button id="save-next" class="btn" type="button" title="Save, then open the next bag that still needs a rating">Save &amp; next</button>
        </div>

        <div class="danger-zone">
          <button id="delete" class="btn btn-danger" type="button">Delete bag</button>
          <button id="restore" class="btn" type="button">Restore bag</button>
        </div>
        <p id="edit-meta" class="muted small"></p>
      </form>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
